name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MyApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/archive.log

      - name: Package .ipa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/MyApp.xcarchive/Products/Applications/MyApp.app build/Payload/
          cd build
          zip -qry MyApp-unsigned.ipa Payload
          ls -lh MyApp-unsigned.ipa
          unzip -l MyApp-unsigned.ipa | head -20

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyApp-unsigned-ipa
          path: build/MyApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
